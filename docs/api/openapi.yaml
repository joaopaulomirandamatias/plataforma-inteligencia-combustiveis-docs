openapi: "3.1.0"
info:
  title: Plataforma de Inteligência de Combustíveis — API
  version: 1.0.0-draft
  description: |
    Contrato público (Published Language) da plataforma. Regras transversais
    no guia de consumo (guia-de-consumo.md):
    - Consulta temporal: todo recurso histórico aceita `as_of`.
    - Paginação: cursor keyset opaco; offset não existe.
    - Erros: RFC 9457 (Problem Details).
    - Score e ranking exigem papel de órgão (ADR-005) — campos sensíveis são
      mascarados pelo gateway conforme papel+escopo, nunca pelo cliente.

    ## `x-estado` — o que está NO AR, e o que está no papel

    Este documento descreve o contrato ALVO. Nem toda operação declarada aqui
    é servida hoje: das treze operações, **seis respondem e sete devolvem
    404**. Um consumidor que trate o documento inteiro como disponível erra na
    maioria das chamadas. Por isso **toda operação carrega `x-estado`**, e é
    ele — não a presença no documento — que diz se dá para chamar:

    | `x-estado` | Significado | Servida hoje? |
    |---|---|---|
    | `implemented` | Servida pelo runtime público, anônima. | **sim** |
    | `planned` | Desenhada, ainda sem implementação. | não (404) |
    | `restricted` | Existe por desenho e **não pode** ser servida ao público: depende de papel de órgão, que ainda não existe. | não (404) |
    | `deprecated` | Ainda servida, com remoção anunciada. | sim |

    O inventário serve de **allowlist** para integrador: filtre por
    `x-estado in (implemented, deprecated)` e você tem exatamente o que o
    runtime responde. A suíte do backend verifica os DOIS sentidos —
    `implemented` sem rota servida é vermelho, e rota servida marcada
    `planned`/`restricted` também. A comparação é sobre o **caminho efetivo**
    (`servers[].url` + path), não sobre o nome do path.

    ## Localização das operações

    A base dos `servers` fica na **raiz do host**, e cada operação carrega o
    próprio prefixo no path. Motivo: `/saude` NÃO é versionada — responde
    sobre o processo, não sobre o contrato de negócio, e é o alvo do health
    check da plataforma (`railway.json: healthcheckPath: /saude`). Com a base
    em `.../v1` o documento apontava `/v1/saude`, que devolve 404. As rotas de
    negócio trazem `/v1/` explícito no path.

    ## Autenticação

    O runtime público de hoje é **anônimo**: as operações `implemented`
    declaram `security: []` e não pedem credencial nenhuma. Os esquemas `oidc`
    e `apiKey` continuam declarados porque são o desenho das operações
    `restricted` e `planned` — não existem em produção ainda.
  contact:
    name: Documentação
    url: https://github.com/joaopaulomirandamatias/plataforma-inteligencia-combustiveis-docs

servers:
  - url: https://pic-api-production.up.railway.app
    description: >
      Produção. Base na RAIZ do host: as rotas de negócio carregam `/v1` no
      próprio path e `/saude` responde na raiz.
  - url: "{origem}"
    description: >
      Outros ambientes (local, sandbox). Mesma disposição de paths — só a
      origem muda.
    variables:
      origem:
        default: http://127.0.0.1:8000
        description: esquema, host e porta onde o serviço responde.

# Padrão do documento — as operações `implemented` sobrescrevem com
# `security: []`, porque o runtime público não pede credencial nenhuma.
security:
  - oidc: []
  - apiKey: []

tags:
  - name: postos
    description: Consulta pública e histórica de postos e suas evidências.
  - name: rankings
    description: Restrito a papel de órgão com escopo
  - name: precos
    description: >
      Série de observações de preço (posto × produto × semana). Agregado de
      preço não vive aqui — vive na ficha, em `getContextoRegional`.
  - name: webhooks
    description: Assinaturas de notificações para integrações autorizadas.
  - name: datasets
    description: Catálogo de datasets abertos e versionados.
  - name: operacao
    description: Saúde e frescor — fora do versionamento /v1

paths:
  /saude:
    get:
      tags: [operacao]
      summary: Saúde do serviço e frescor dos dados
      operationId: getSaude
      x-estado: implemented
      security: []
      responses:
        "200":
          description: Serviço saudável e estado de frescor das fontes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Saude" }

  /v1/postos:
    get:
      tags: [postos]
      summary: Coleção de postos (ficha reduzida)
      operationId: listarPostos
      x-estado: implemented
      security: []
      parameters:
        - name: uf
          in: query
          schema: { type: string, minLength: 2, maxLength: 2 }
        - name: municipio
          in: query
          description: >
            Nome do município como publicado pela fonte. NÃO é código IBGE — a
            PIC não tem código IBGE em nenhuma fonte, e este filtro nunca o
            aceitou. A entrada é normalizada (caixa alta, sem acento).
          schema: { type: string }
        - name: q
          in: query
          description: >
            Busca por razão social ou CNPJ. Classificação: removidos os dígitos,
            se sobram só separadores de CNPJ é CNPJ, qualquer letra torna textual.
            Termo com menos de 3 caracteres é RECUSADO (422 `busca_curta`) — `%a%`
            varreria a tabela para devolver ruído que o usuário leria como resposta.
          schema: { type: string, minLength: 3 }
        - $ref: "#/components/parameters/AsOf"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: >
            Ordenação estável com COLLATE "C" — cursor keyset independente da
            collation do ambiente (armadilha 8). O campo `busca` ecoa o termo
            aplicado: é o contrato antifalha-silenciosa — cliente que não vê o
            eco sabe que a busca por nome não foi aplicada, em vez de exibir a
            lista inteira como se fosse resultado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginaPostos" }
        "422": { $ref: "#/components/responses/Problem" }

  /v1/postos/mapa:
    get:
      tags: [postos]
      summary: Um ponto por posto, por viewport ou raio
      operationId: listarPostosMapa
      x-estado: implemented
      security: []
      description: >
        Retorna **no máximo um item por `posto_id`**: um ponto desenhável por posto.
        O item continua sendo UMA evidência GEO-ANP ou GEO-01 com coordenada
        encontrada e vigente no `as_of`, preservando provedor, versão, hashes,
        fonte e localizador — a API não funde coordenadas nem calcula média.
        Quando há mais de uma evidência viva para o mesmo posto no recorte, a
        escolha é determinística e nesta ordem: (1) autoridade da fonte —
        GEO-ANP, posição publicada pela ANP, vence GEO-01, geocodificação por
        endereço, que é o fallback declarado; (2) `coletado_em` mais recente;
        (3) desempate endereçado por conteúdo (`resultado_sha256`, depois
        provedor e versão), ordenado com collation `C`. A mesma entrada produz a
        mesma saída entre execuções e entre ambientes; a distância NÃO participa
        do desempate, para que o ponto de um posto não dependa de onde o cliente
        buscou. Escolher não é declarar coordenada canônica: o item diz qual
        evidência foi usada, e a auditoria continua possível pelo `evidencia_id`.
        A escolha é feita entre as evidências DENTRO do recorte pedido.
        O cliente informa exatamente um modo: bounding-box completo
        (`min_lat`, `min_lon`, `max_lat`, `max_lon`) OU raio completo
        (`lat`, `lon`, `raio_m`). Misturar, omitir ou enviar um grupo incompleto
        é erro 422. O limite é duro e conta POSTOS; `truncado=true` manda o
        cliente reduzir o viewport/raio em vez de tentar paginar o universo
        inteiro de pontos.
      parameters:
        - name: min_lat
          in: query
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: min_lon
          in: query
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: max_lat
          in: query
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: max_lon
          in: query
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: lat
          in: query
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lon
          in: query
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: raio_m
          in: query
          schema: { type: number, exclusiveMinimum: 0, maximum: 100000 }
        - name: provedor
          in: query
          description: Filtro opcional da evidência geográfica; não define canonicidade.
          schema: { type: string, minLength: 1 }
        - name: versao_provedor
          in: query
          description: Filtro opcional da versão do provedor; exige `provedor`.
          schema: { type: string, minLength: 1 }
        - $ref: "#/components/parameters/AsOf"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        "200":
          description: >
            Um ponto por posto dentro do filtro solicitado; `posto_id` não se
            repete na lista. `distancia_m` é preenchida no modo raio e nula no
            modo bbox.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapaPostos" }
        "422": { $ref: "#/components/responses/Problem" }

  /v1/postos/{posto_id}:
    get:
      tags: [postos]
      summary: Ficha do posto (campos conforme papel)
      operationId: getPosto
      x-estado: implemented
      security: []
      parameters:
        - $ref: "#/components/parameters/PostoId"
        - $ref: "#/components/parameters/AsOf"
      responses:
        "200":
          description: Ficha as-of; visão pública contém apenas fatos com fonte.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Posto" }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/postos/{posto_id}/contexto-regional:
    get:
      tags: [postos]
      summary: Preço do posto ao lado da média regional do produto
      operationId: getContextoRegional
      x-estado: implemented
      security: []
      description: >
        Para cada produto que o posto precificou na SEMANA ANP mais recente com
        preço dele, devolve o `valor_venda` estruturado do posto e a média do
        MESMO produto na MESMA semana em dois escopos: o município e a UF do
        posto. `amostras` é COBERTURA — número de postos DISTINTOS que sustentam
        a média, nunca contagem de linhas. A média é a média aritmética simples
        de `valor_venda`. O agregado não tem `localizador`: não há origem única a
        apontar; o `localizador` do item é a auditoria do fato de preço do
        próprio posto.


        **Existência é pergunta as-of.** Existe, para esta rota, o posto com
        CADASTRO VIGENTE no `as_of` pedido — a mesma pergunta que a ficha
        (`getPosto`) faz, e a mesma resposta. Sem cadastro vigente no instante,
        a resposta é `404 posto_nao_encontrado`, inclusive para posto conhecido
        APENAS por fato de preço: ter sido precificado não faz um posto existir
        no instante. Assim `itens: []` fica com um significado só — o posto
        existia ali e não tem preço no recorte —, em vez de acumular também
        "este posto não existia aqui". Esta é a regra do CONTRATO, e é o que o
        backend é cobrado a cumprir; enquanto ela não estiver no runtime, a
        rota ainda pode decidir existência pelo registro atemporal de
        identificadores e devolver `200` com `itens: []` onde o contrato manda
        404 — divergência conhecida, com correção em curso no backend.
      parameters:
        - $ref: "#/components/parameters/PostoId"
        - $ref: "#/components/parameters/AsOf"
      responses:
        "200":
          description: >
            Contexto regional as-of. Um item por produto precificado na semana
            mais recente com preço do posto; cada item traz a média no município
            e na UF.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextoRegional" }
              example:
                posto_id: "posto-abc123"
                as_of: "2026-08-02T00:00:00Z"
                itens:
                  - produto: "GASOLINA COMUM"
                    preco_posto: 6.199
                    unidade: "R$ / litro"
                    semana_inicio: "2026-07-26"
                    semana_fim: "2026-08-02"
                    fonte: "F03"
                    localizador: "precos.csv@sha256:abcd…:42"
                    medias:
                      - escopo: "municipio"
                        nome: "MACAPA"
                        uf: "AP"
                        media: 6.2733
                        amostras: 12
                      - escopo: "uf"
                        nome: "AP"
                        uf: "AP"
                        media: 6.4015
                        amostras: 57
        "404": { $ref: "#/components/responses/Problem" }

  /v1/postos/{posto_id}/historico:
    get:
      tags: [postos]
      summary: Linha do tempo consolidada de fatos
      operationId: getHistorico
      x-estado: planned
      x-estado-motivo: >
        Sem implementação. A ficha do posto (`getPosto`) já devolve
        `fatos_recentes` com fonte e localizador, limitados por tipo; a
        linha do tempo paginada e completa é card próprio.
      parameters:
        - $ref: "#/components/parameters/PostoId"
        - $ref: "#/components/parameters/AsOf"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de fatos datados com fonte e localizador.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginaHistorico" }

  /v1/postos/{posto_id}/grupo:
    get:
      tags: [postos]
      summary: Vínculo societário aparente
      description: Requer papel de órgão. Pessoas físicas aparecem apenas
        como `pessoa_id` + nome, jamais CPF; arestas carregam nível T1–T4
        e confiança.
      operationId: getGrupo
      x-estado: restricted
      x-estado-motivo: >
        Não pode ser servida ao público. O vínculo societário tem camada de
        PESSOA FÍSICA, e o cofre de identidade (ADR-004) mantém pessoa
        física fora da borda pública — a operação já declara
        `x-required-role: orgao`, e papel de órgão não existe no runtime
        anônimo de hoje. Implementar sem o papel seria publicar o que a
        decisão proíbe.
      x-required-role: orgao
      parameters:
        - $ref: "#/components/parameters/PostoId"
        - $ref: "#/components/parameters/AsOf"
      responses:
        "200":
          description: Grupo societário aparente no instante consultado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrupoSocietario" }
        "403": { $ref: "#/components/responses/Problem" }

  /v1/rankings/fiscalizacao:
    get:
      tags: [rankings]
      summary: Ranking de priorização de fiscalização
      operationId: getRanking
      x-estado: restricted
      x-estado-motivo: >
        Não pode ser servida ao público. Score e ranking são restritos a
        órgão autenticado com escopo por ADR-005, que PROÍBE score em
        resposta de API sem papel de órgão. Não é permissão faltando: é
        contrato.
      x-required-role: orgao
      parameters:
        - name: uf
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 2 }
        - name: produto
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/AsOf"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Escopo ABAC aplicado — a UF pedida precisa pertencer
            ao escopo do token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginaRanking" }
        "403": { $ref: "#/components/responses/Problem" }

  /v1/precos:
    get:
      tags: [precos]
      summary: Série de preços SLP
      operationId: getPrecos
      x-estado: implemented
      security: []
      description: >
        Cada item é uma OBSERVAÇÃO INDIVIDUAL — posto × produto × semana ANP —,
        nunca um agregado. Não há tamanho de amostra a declarar aqui, e o
        consumidor não deve inferir um: quem tem noção de cobertura é
        `getContextoRegional`, onde `amostras` conta postos DISTINTOS por trás
        de uma média.


        **Valor nominal.** `valor_venda` sai exatamente como a fonte publicou,
        na `unidade` que veio junto. A PIC não deflaciona, não converte e não
        arredonda: escolher índice e competência é decisão de quem consome. Por
        isso o item carrega a SEMANA DE REFERÊNCIA (`semana_inicio` /
        `semana_fim`, o mesmo par do contexto regional) — é o campo que permite
        casar a observação com uma série externa.


        **Ausência nunca é zero.** A cobertura do SLP é parcial por desenho:
        posto sem pesquisa na semana simplesmente NÃO tem linha, e a API não
        sintetiza nenhuma. `valor_venda` pode vir `null` quando a fonte publicou
        a observação sem preço de venda — `null` é "não observado", e zero seria
        um preço. Lista vazia significa "nada no recorte", nunca "preço zero".


        **`municipio` e `produto` são o TEXTO da ANP**, não código IBGE e não
        vocabulário controlado. A entrada é normalizada para a grafia da fonte
        (caixa alta, sem acento) e o valor efetivamente aplicado volta em
        `filtros` — cliente que recebe lista vazia vê qual recorte foi usado,
        em vez de adivinhar se o filtro pegou.


        **Semana.** `semana` recorta UMA semana e exige o **domingo** de
        início (a semana ANP é `[domingo, domingo+7)`); qualquer outro dia é 422
        `semana_nao_e_domingo`, porque casaria com zero linhas e o vazio seria
        lido como "não houve preço". `semana_de`/`semana_ate` recortam um
        período pelo início da semana, inclusive nas duas pontas. Misturar
        `semana` com qualquer uma das duas é 422 `filtro_semana_ambiguo`.
        `as_of` é ortogonal: é a viagem no tempo (o que a base sabia), não um
        filtro de semana.


        **Paginação e limite.** Cursor keyset opaco sobre a chave do grão
        (semana, posto, produto), com ordenação total e `COLLATE "C"` —
        independente da collation do ambiente (armadilha 8). O `limit` tem
        limite DURO: pedir acima do teto é 422, nunca um corte silencioso.
      parameters:
        - name: produto
          in: query
          description: >
            Texto do produto como a ANP publica (ex.: `GASOLINA COMUM`,
            `ETANOL`). Igualdade exata sobre a grafia normalizada.
          schema: { type: string, minLength: 1 }
        - name: uf
          in: query
          schema: { type: string, minLength: 2, maxLength: 2 }
        - name: municipio
          in: query
          description: >
            Nome do município como a ANP publica (ex.: `MACAPA`). NÃO é código
            IBGE — a PIC não tem código IBGE em nenhuma fonte.
          schema: { type: string, minLength: 1 }
        - name: semana
          in: query
          description: "Domingo de início da semana ANP (`AAAA-MM-DD`)."
          schema: { type: string, format: date }
        - name: semana_de
          in: query
          description: Início do período, comparado com o início da semana (inclusive).
          schema: { type: string, format: date }
        - name: semana_ate
          in: query
          description: Fim do período, comparado com o início da semana (inclusive).
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/AsOf"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: >
            Página da série, ordenada por (semana, posto, produto). `filtros`
            ecoa o recorte efetivamente aplicado — contrato antifalha-silenciosa.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginaPrecos" }
              example:
                itens:
                  - posto_id: "posto-abc123"
                    produto: "GASOLINA COMUM"
                    valor_venda: 6.199
                    unidade: "R$ / litro"
                    bandeira: "VIBRA"
                    municipio: "MACAPA"
                    uf: "AP"
                    regiao: "N"
                    semana_inicio: "2026-07-26"
                    semana_fim: "2026-08-02"
                    fonte: "F03"
                    localizador: "precos.csv@sha256:abcd…:42"
                  - posto_id: "posto-abc123"
                    produto: "ETANOL"
                    valor_venda: null
                    unidade: "R$ / litro"
                    bandeira: "VIBRA"
                    municipio: "MACAPA"
                    uf: "AP"
                    regiao: "N"
                    semana_inicio: "2026-07-26"
                    semana_fim: "2026-08-02"
                    fonte: "F03"
                    localizador: "precos.csv@sha256:abcd…:43"
                proximo_cursor: "MjAyNi0wNy0yNh9wb3N0by1hYmMxMjMfRVRBTk9M"
                as_of: "2026-08-02T00:00:00Z"
                versao_snapshot: "cargas/F01:9,F02:2,F03:3"
                limite: 50
                filtros:
                  produto: null
                  uf: "AP"
                  municipio: "MACAPA"
                  semana: "2026-07-26"
                  semana_de: null
                  semana_ate: null
        "400": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /v1/webhooks/assinaturas:
    post:
      tags: [webhooks]
      summary: Registrar endpoint assinante
      operationId: criarAssinatura
      x-estado: planned
      x-estado-motivo: >
        Sem implementação. O despachante de webhooks pressupõe cliente
        identificado (a assinatura pertence a alguém) e segredo HMAC —
        os dois dependem da autenticação, que ainda não existe.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NovaAssinatura" }
      responses:
        "201":
          description: Assinatura registrada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assinatura" }
        "409": { $ref: "#/components/responses/Problem" }
    get:
      tags: [webhooks]
      summary: Listar assinaturas do cliente
      operationId: listarAssinaturas
      x-estado: planned
      x-estado-motivo: >
        Sem implementação. O despachante de webhooks pressupõe cliente
        identificado (a assinatura pertence a alguém) e segredo HMAC —
        os dois dependem da autenticação, que ainda não existe.
      responses:
        "200":
          description: Assinaturas registradas para o cliente.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Assinatura" }

  /v1/webhooks/assinaturas/{assinatura_id}:
    delete:
      tags: [webhooks]
      summary: Cancelar assinatura
      operationId: removerAssinatura
      x-estado: planned
      x-estado-motivo: >
        Sem implementação. O despachante de webhooks pressupõe cliente
        identificado (a assinatura pertence a alguém) e segredo HMAC —
        os dois dependem da autenticação, que ainda não existe.
      parameters:
        - name: assinatura_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Cancelada. }

  /v1/datasets:
    get:
      tags: [datasets]
      summary: Datasets abertos versionados
      operationId: listarDatasets
      x-estado: planned
      x-estado-motivo: >
        Sem implementação. Não há publicação de dataset versionado; o que
        existe hoje são as tabelas de fato servidas pelas rotas de consulta.
      responses:
        "200":
          description: Datasets abertos disponíveis.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Dataset" }

components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.example.invalid/realms/plataforma/.well-known/openid-configuration
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Somente rotas públicas e datasets.

  parameters:
    PostoId:
      name: posto_id
      in: path
      required: true
      schema: { type: string }
      description: Identificador canônico (ADR-003).
    AsOf:
      name: as_of
      in: query
      schema: { type: string, format: date-time }
      description: >
        Consulta as-of bitemporal. O instante é aplicado nos DOIS eixos ao mesmo
        tempo: a resposta traz a versão que estava VÁLIDA no mundo naquele
        instante (`validade @> as_of`) **e** que a base JÁ CONHECIA naquele
        instante (`transacao @> as_of`). Não é só "como o mundo era": é "o que a
        plataforma sabia sobre o mundo". Omitido = agora, o snapshot corrente.


        **Consequência prática.** Existe um PISO DE TRANSAÇÃO — o instante em
        que a base registrou sua primeira carga. `as_of` anterior a esse piso
        não devolve o estado antigo: devolve NADA, porque naquele instante a
        base ainda não conhecia fato nenhum. Coleção responde `200` com lista
        vazia; recurso único responde `404 posto_nao_encontrado`. Vazio aqui
        significa "a base ainda não sabia", não "não existia no mundo", e não é
        erro do cliente nem falha do serviço. O piso é propriedade do AMBIENTE,
        não deste contrato: muda de base para base e avança quando a base é
        recarregada — para descobrir o do ambiente em uso, recue o `as_of` até
        a resposta esvaziar.
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Cursor keyset opaco da página anterior.
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: Obrigatória em todo POST com efeito.

  responses:
    Problem:
      description: Erro no formato RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        codigo: { type: string, description: "catálogo de códigos de domínio, versionado junto deste contrato" }
        correlation_id: { type: string, description: identificador opaco para correlação com os logs do serviço }

    Posto:
      type: object
      required: [posto_id, versao_snapshot, as_of]
      properties:
        posto_id: { type: string }
        versao_snapshot: { type: string, description: 'versão as-of exibida — todo número é reproduzível. Até existir snapshot materializado, formato provisório `cargas/F01:n,F02:n,F03:n`, resolvível contra ingestao.carga' }
        as_of: { type: string, format: date-time }
        razao_social: { type: string }
        cnpj: { type: string, description: chave pública da fonte F01 — dado público de PJ }
        bandeira: { type: string }
        endereco: { type: string }
        municipio: { type: string, description: "nome do município, como publicado pela fonte" }
        uf: { type: string }
        cadastro_desde: { type: string, format: date-time, description: início da validade do cadastro vigente (armadilha 7 — data da coleta) }
        cargas:
          type: array
          description: frescor por fonte no momento da resposta
          items:
            type: object
            properties:
              fonte: { type: string }
              carga_id: { type: integer }
              coletado_em: { type: string, format: date-time }
        situacao_cadastral: { type: string, description: fase Entrega — ausente na API mínima }
        selo_transparencia: { type: boolean, description: fase Entrega — ausente na API mínima }
        fatos_recentes:
          type: array
          items: { $ref: "#/components/schemas/Fato" }
        contraditorio:
          type: array
          description: Manifestações do posto sobre fatos exibidos.
          items:
            type: object
            properties:
              fato_ref: { type: string }
              manifestacao: { type: string }
              data: { type: string, format: date }

    Fato:
      type: object
      required: [tipo, data_validade, fonte, localizador]
      properties:
        tipo: { type: string, enum: [pmqc, autuacao, aferição, cadastro, preco, atendimento] }
        data_validade: { type: string, format: date }
        descricao: { type: string, description: "factual, datada — política de linguagem aplicada na origem" }
        fonte: { type: string }
        localizador: { type: string, description: linhagem até a origem }

    MediaRegional:
      type: object
      required: [escopo, nome, uf, media, amostras]
      description: >
        Média de `valor_venda` do produto na semana, restrita a um escopo
        geográfico. Sem `localizador`: é agregado de muitos fatos, não há origem
        única a apontar.
      properties:
        escopo: { type: string, enum: [municipio, uf] }
        nome: { type: string, description: "município (escopo municipio) ou UF (escopo uf), como publicado pela fonte" }
        uf: { type: string, description: "UF do escopo — sempre presente, inclusive no escopo municipio" }
        media: { type: number, description: média aritmética simples de valor_venda no produto+semana+escopo }
        amostras: { type: integer, minimum: 1, description: "postos DISTINTOS que sustentam a média (cobertura), nunca contagem de linhas" }

    ItemContextoRegional:
      type: object
      required: [produto, preco_posto, semana_inicio, semana_fim, fonte, medias]
      properties:
        produto: { type: string }
        preco_posto: { type: number, description: valor_venda estruturado do posto (não é parse de texto) }
        unidade: { type: [string, "null"], description: "unidade da fonte, ex.: R$ / litro" }
        semana_inicio: { type: string, format: date, description: "início da semana ANP [domingo, domingo+7)" }
        semana_fim: { type: string, format: date, description: "fim exclusivo da semana ANP (domingo+7)" }
        fonte: { type: string, description: fonte do preço (F03/SLP) }
        localizador: { type: string, description: linhagem do fato de preço do próprio posto — dado de auditoria }
        medias:
          type: array
          description: escopo municipio e escopo uf; um escopo é omitido quando a linha de preço do posto não tem aquela chave geográfica
          items: { $ref: "#/components/schemas/MediaRegional" }

    ContextoRegional:
      type: object
      required: [posto_id, as_of, itens]
      properties:
        posto_id: { type: string }
        as_of: { type: string, format: date-time }
        itens:
          type: array
          description: um item por produto precificado na semana mais recente com preço do posto; vazio quando não há preço
          items: { $ref: "#/components/schemas/ItemContextoRegional" }

    GrupoSocietario:
      type: object
      properties:
        grupo_id: { type: string }
        postos:
          type: array
          items: { type: string }
        arestas:
          type: array
          items:
            type: object
            required: [origem, destino, nivel, confianca]
            properties:
              origem: { type: string }
              destino: { type: string }
              nivel: { type: string, enum: [T1, T2, T3, T4] }
              confianca: { type: number, minimum: 0, maximum: 1 }
              vigencia_inicio: { type: string, format: date }
              vigencia_fim: { type: string, format: date }

    ItemRanking:
      type: object
      required: [posto_id, posicao, score, cobertura, razoes]
      properties:
        posto_id: { type: string }
        posicao: { type: integer }
        score: { type: number }
        intervalo: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
        cobertura: { type: number, description: fração de dado disponível — score sem cobertura não é emitido }
        razoes:
          type: array
          items:
            type: object
            properties:
              feature: { type: string }
              contribuicao: { type: number }

    PrecoSemanal:
      type: object
      required:
        - posto_id
        - produto
        - valor_venda
        - semana_inicio
        - semana_fim
        - fonte
        - localizador
      description: >
        Uma OBSERVAÇÃO de preço: posto × produto × semana ANP. Não é agregado —
        não tem média, não tem amostra, não tem contagem.
      properties:
        posto_id: { type: string, description: "identificador canônico (ADR-003)" }
        produto: { type: string, description: "texto do produto como a ANP publica" }
        valor_venda:
          type: [number, "null"]
          description: >
            Preço de venda NOMINAL, na `unidade` da fonte — sem deflação, sem
            conversão, sem arredondamento. `null` quando a fonte publicou a
            observação sem preço de venda. `null` é ausência de observação;
            **zero seria um preço**, e a API nunca o inventa.
        unidade: { type: [string, "null"], description: "unidade da fonte, ex.: R$ / litro" }
        bandeira: { type: [string, "null"] }
        municipio: { type: [string, "null"], description: "nome do município, como publicado pela fonte" }
        uf: { type: [string, "null"] }
        regiao: { type: [string, "null"], description: "sigla da região, como publicada pela fonte" }
        semana_inicio: { type: string, format: date, description: "início da semana ANP [domingo, domingo+7)" }
        semana_fim: { type: string, format: date, description: "fim exclusivo da semana ANP (domingo+7)" }
        fonte: { type: string, description: "fonte do preço (F03/SLP)" }
        localizador: { type: string, description: linhagem até a origem }

    FiltrosPrecos:
      type: object
      required: [produto, uf, municipio, semana, semana_de, semana_ate]
      description: >
        Recorte EFETIVAMENTE aplicado, já normalizado para a grafia da fonte.
        Contrato antifalha-silenciosa: quem recebe lista vazia lê aqui qual
        filtro produziu o vazio, em vez de supor que o filtro não pegou.
      properties:
        produto: { type: [string, "null"] }
        uf: { type: [string, "null"] }
        municipio: { type: [string, "null"] }
        semana: { type: [string, "null"], format: date }
        semana_de: { type: [string, "null"], format: date }
        semana_ate: { type: [string, "null"], format: date }

    PaginaHistorico:
      type: object
      properties:
        itens: { type: array, items: { $ref: "#/components/schemas/Fato" } }
        proximo_cursor: { type: string }
    PaginaRanking:
      type: object
      properties:
        itens: { type: array, items: { $ref: "#/components/schemas/ItemRanking" } }
        proximo_cursor: { type: string }
    PaginaPrecos:
      type: object
      required: [itens, proximo_cursor, as_of, versao_snapshot, limite, filtros]
      properties:
        itens:
          type: array
          description: >
            Observações ordenadas por (semana, posto, produto), com `COLLATE "C"`.
            Vazio significa "nenhuma observação no recorte" — nunca "preço zero".
          items: { $ref: "#/components/schemas/PrecoSemanal" }
        proximo_cursor:
          type: [string, "null"]
          description: >
            Cursor keyset opaco da próxima página; `null` na última. Não
            interprete nem construa cursores — a chave é composta, e cursor de
            outra coleção é recusado com 400 `cursor_invalido`.
        as_of: { type: string, format: date-time }
        versao_snapshot: { type: string, description: "mesma semântica de `Posto.versao_snapshot`" }
        limite: { type: integer, minimum: 1, maximum: 200, description: "limite DURO aplicado; pedir acima do teto é 422, nunca corte silencioso" }
        filtros: { $ref: "#/components/schemas/FiltrosPrecos" }

    Saude:
      type: object
      required: [versao, estado, versao_snapshot, contagens, cargas]
      properties:
        versao: { type: string, description: versão do código em execução }
        estado: { type: string }
        versao_snapshot: { type: string }
        contagens:
          type: object
          additionalProperties: { type: integer }
          description: fatos por conjunto (F01/F02/F03/F06)
        cargas:
          type: array
          items:
            type: object
            properties:
              fonte: { type: string }
              carga_id: { type: integer }
              coletado_em: { type: string, format: date-time }
              cargas: { type: integer, description: total de cargas da fonte }
              linhas_carregadas: { type: integer }
        execucoes:
          type: array
          description: >
            Última TENTATIVA da agenda por fonte — pergunta DIFERENTE de
            `cargas[].coletado_em`, que só avança quando nasce carga nova. Uma
            fonte que roda todo dia e não encontra novidade no upstream não gera
            carga, então `coletado_em` envelhece JUNTO COM A COLETA SAUDÁVEL. Em
            2026-08-28 isso produziu alarme falso: F03 com carga de 20 dias e
            cadência declarada de 7 foi reportada como coleta quebrada, quando a
            agenda rodara e a ANP simplesmente não publicara competência nova.
            Use `execucoes` para saber se alguém TENTOU; `cargas` para saber se
            ENTROU dado. Fonte que nunca produziu carga aparece aqui e não lá.
          items:
            type: object
            required: [fonte, ultima_execucao, acao]
            properties:
              fonte: { type: string }
              ultima_execucao: { type: string, format: date-time }
              acao:
                type: string
                enum: [executada, em dia, indisponível, erro, sem espaço]
                description: >
                  Veredito da agenda para a fonte naquela execução.
                  `indisponível` é outage DA FONTE — nada publicado ainda, ou
                  endereço que deixou de existir — e não falha da execução.
    PostoResumo:
      type: object
      properties:
        posto_id: { type: string }
        razao_social: { type: string }
        bandeira: { type: string }
        municipio: { type: string }
        uf: { type: string }
    PaginaPostos:
      type: object
      properties:
        itens: { type: array, items: { $ref: "#/components/schemas/PostoResumo" } }
        proximo_cursor: { type: [string, "null"] }
        as_of: { type: string, format: date-time }
        busca: { type: [string, "null"], description: termo de busca efetivamente aplicado (eco antifalha-silenciosa); null quando não houve q }

    PontoMapa:
      type: object
      required:
        - evidencia_id
        - posto_id
        - latitude
        - longitude
        - provedor
        - versao_provedor
        - resultado_sha256
        - coletado_em
        - fonte
        - localizador
      properties:
        evidencia_id: { type: integer, description: "identificador da evidência geográfica ESCOLHIDA para representar o posto neste recorte; não é localização canônica, e pode mudar quando uma coleta nova chega" }
        posto_id: { type: string }
        razao_social: { type: [string, "null"] }
        bandeira: { type: [string, "null"] }
        municipio: { type: [string, "null"] }
        uf: { type: [string, "null"] }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        distancia_m: { type: [number, "null"], minimum: 0, description: somente no modo raio }
        provedor: { type: string }
        versao_provedor: { type: string }
        resultado_chave: { type: [string, "null"], description: "chave do resultado no provedor, quando ele publica uma; opcional de propósito — GEO-01 nem sempre tem" }
        resultado_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: >
            Hash do resultado normalizado, SEMPRE presente — é o que endereça a
            evidência por conteúdo. Participa da ordem determinística que
            escolhe o ponto do posto (ver `listarPostosMapa`), então uma
            evidência sem ele não teria como ser escolhida de forma estável.
            Não confundir com `resultado_chave`, que é opcional.
        coletado_em: { type: string, format: date-time }
        fonte: { type: string, enum: [GEO-01, GEO-ANP] }
        localizador: { type: string, description: linhagem interna da evidência geográfica }

    MapaPostos:
      type: object
      required: [itens, truncado, modo, limite, as_of]
      properties:
        itens:
          type: array
          description: >
            Um item por posto; `posto_id` não se repete. Cada item é a evidência
            escolhida pela regra determinística descrita em `listarPostosMapa`.
          items: { $ref: "#/components/schemas/PontoMapa" }
        truncado:
          type: boolean
          description: >
            true quando há mais POSTOS no filtro do que o `limite`; cliente deve
            reduzir viewport/raio. Conta postos, não evidências.
        modo: { type: string, enum: [bbox, raio] }
        limite: { type: integer, minimum: 1, maximum: 1000 }
        as_of: { type: string, format: date-time }

    NovaAssinatura:
      type: object
      required: [url, eventos]
      properties:
        url: { type: string, format: uri }
        eventos:
          type: array
          description: Subconjunto assinável do catálogo — ver webhooks.md.
          items: { type: string, enum: [caso.publicado, snapshot.publicado, ato-normativo.publicado] }
    Assinatura:
      allOf:
        - $ref: "#/components/schemas/NovaAssinatura"
        - type: object
          properties:
            assinatura_id: { type: string }
            segredo_hmac_criado_em: { type: string, format: date-time, description: o segredo é exibido uma única vez na criação }
            ativa: { type: boolean }

    Dataset:
      type: object
      properties:
        nome: { type: string }
        versao: { type: string }
        url: { type: string, format: uri }
        licenca: { type: string }
        gerado_em: { type: string, format: date-time }
